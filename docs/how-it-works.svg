<svg xmlns="http://www.w3.org/2000/svg" width="920" height="386" viewBox="0 24 920 386" role="img" aria-labelledby="t d">
  <title id="t">How Agent Control works</title>
  <desc id="d">The display long-polls the hub for sessions and sends taps back to it. The hub runs a probe on each machine, as a child process on its own machine and piped over SSH to the others, and runs a tap's command on the session's machine: on a GNOME desktop, the agent-control-window helper from desktop/, which raises and marks the session's window.</desc>
  <defs>
    <style>
      .title { font: 700 14px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; letter-spacing: 1.5px; fill: #ffcc99; }
      .body  { font: 400 12.5px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #e8e8e8; }
      .dim   { font: 400 11.5px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #8c8c8c; }
      .mono  { font: 400 11.5px ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; fill: #e8e8e8; }
      .tag   { font: 700 10.5px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; letter-spacing: 2.5px; }
      .panel { fill: #0e0e0e; stroke: #2c2c2c; stroke-width: 1.5; }
      .tap   { fill: none; stroke: #ff9900; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
      .ses   { fill: none; stroke: #9999ff; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    </style>
    <marker id="aTap" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#ff9900"/>
    </marker>
    <marker id="aSes" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#9999ff"/>
    </marker>
  </defs>

  <rect y="24" width="920" height="386" rx="22" fill="#000"/>


  <!-- Display -->
  <rect class="panel" x="32" y="140" width="190" height="120" rx="14"/>
  <rect x="32" y="140" width="10" height="120" rx="5" fill="#ff9900"/>
  <text class="title" x="58" y="172">DISPLAY</text>
  <text class="body"  x="58" y="196">Waveshare ESP32-S3</text>
  <text class="body"  x="58" y="214">7″ touch screen</text>
  <text class="dim"   x="58" y="240">holds only a device key</text>

  <!-- Hub -->
  <rect class="panel" x="392" y="140" width="190" height="120" rx="14"/>
  <rect x="392" y="140" width="10" height="120" rx="5" fill="#ffcc99"/>
  <text class="title" x="418" y="172">HUB</text>
  <text class="body"  x="418" y="196">FastAPI · port 8767</text>
  <text class="body"  x="418" y="214">merges, sorts, counts</text>
  <text class="dim"   x="418" y="240">one probe per machine</text>

  <!-- This machine -->
  <rect class="panel" x="700" y="58" width="188" height="110" rx="14"/>
  <rect x="700" y="58" width="10" height="110" rx="5" fill="#9999ff"/>
  <text class="title" x="726" y="86">THIS MACHINE</text>
  <text class="body"  x="726" y="109">probe: child process</text>
  <text class="mono"  x="726" y="128">claude agents --json</text>
  <text class="body"  x="726" y="151">tap: <tspan class="mono" style="font-size:10.5px">agent-control-window</tspan></text>

  <!-- Other machines (stacked) -->
  <rect x="714" y="218" width="188" height="110" rx="14" fill="#0a0a0a" stroke="#1f1f1f" stroke-width="1.5"/>
  <rect x="707" y="225" width="188" height="110" rx="14" fill="#0c0c0c" stroke="#262626" stroke-width="1.5"/>
  <rect class="panel" x="700" y="232" width="188" height="110" rx="14"/>
  <rect x="700" y="232" width="10" height="110" rx="5" fill="#9999ff"/>
  <text class="title" x="726" y="260">OTHER MACHINES</text>
  <text class="body"  x="726" y="283">probe: piped over SSH</text>
  <text class="dim"   x="726" y="302">nothing to install for it</text>
  <text class="body"  x="726" y="325">tap: <tspan class="mono" style="font-size:10.5px">agent-control-window</tspan></text>

  <!-- Display ⇄ hub -->
  <text class="tag"  x="307" y="161" text-anchor="middle" fill="#ff9900">TAPS</text>
  <text class="mono" x="307" y="176" text-anchor="middle">/api/focus · /api/new</text>
  <path class="tap" d="M230,186 H380" marker-end="url(#aTap)"/>
  <path class="ses" d="M384,214 H234" marker-end="url(#aSes)"/>
  <text class="tag"  x="307" y="237" text-anchor="middle" fill="#9999ff">SESSIONS</text>
  <text class="mono" x="307" y="252" text-anchor="middle">long poll /api/fleet</text>

  <!-- Hub ⇄ this machine -->
  <path class="tap" d="M590,170 H622 Q636,170 636,156 V110 Q636,96 650,96 H688" marker-end="url(#aTap)"/>
  <path class="ses" d="M692,130 H666 Q652,130 652,144 V176 Q652,190 638,190 H594" marker-end="url(#aSes)"/>

  <!-- Hub ⇄ other machines -->
  <path class="ses" d="M692,270 H666 Q652,270 652,256 V224 Q652,210 638,210 H594" marker-end="url(#aSes)"/>
  <path class="tap" d="M590,230 H622 Q636,230 636,244 V290 Q636,304 650,304 H688" marker-end="url(#aTap)"/>

  <!-- Legend -->
  <line class="tap" x1="66" y1="368" x2="92" y2="368"/>
  <text class="dim" x="102" y="372">taps: raise a session's window on its machine, or open a new one with +</text>
  <line class="ses" x1="566" y1="368" x2="592" y2="368"/>
  <text class="dim" x="602" y="372">sessions: each machine's probe reports every 3 s</text>
</svg>
