; Agent Control display firmware: every live Claude Code session, on a Waveshare
; ESP32-S3-Touch-LCD-7 (800x480), fed by the hub in ../hub.
;   pio run                 build
;   pio run -t upload       first flash, over USB (then unplug and replug the board once)
;   pio run -t ota          every later flash, over Wi-Fi
; Wi-Fi, hub and hardware settings come from secrets.ini (copy secrets.ini.example).
[platformio]
default_envs = waveshare7
extra_configs = secrets.ini

[env:waveshare7]
; pioarduino's build of the Espressif platform, at the release this firmware is built
; and tested with: PlatformIO's own "espressif32" has no board of this name. It
; builds with PlatformIO core 6.1.19 (pioarduino's), not with 6.2: ../install.sh
; installs that core for ./pio, and names the same version.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
board = esp32-s3-devkitc1-n16r8
framework = espidf
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
board_build.partitions = partitions.csv
build_flags =
    -DAC_WIFI_SSID='"${secrets.wifi_ssid}"'
    -DAC_WIFI_PASSWORD='"${secrets.wifi_password}"'
    -DAC_HUB_URL='"${secrets.hub_url}"'
    -DAC_DEVICE_KEY='"${secrets.device_key}"'
    -DAC_HOSTNAME='"${secrets.hostname}"'
    -DAC_TIMEZONE='"${secrets.timezone}"'
    -DAC_ROTATE_180=${secrets.rotate_180}
    -DAC_LEDS_GPIO=${secrets.leds_gpio}
    -DAC_LEDS_REVERSED=${secrets.leds_reversed}
    -I shared
extra_scripts = post:ota_target.py
