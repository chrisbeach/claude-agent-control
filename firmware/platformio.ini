; Agent Control display firmware: every live Claude Code session, on a Waveshare
; ESP32-S3-Touch-LCD-7 (800x480), fed by the hub in ../hub.
;   pio run                 build
;   pio run -t upload       first flash, over USB (then unplug and replug the board once)
;   pio run -t ota          every later flash, over Wi-Fi
; Wi-Fi, hub and hardware settings come from secrets.ini (copy secrets.ini.example,
; or let ../install.sh write it): settings_header.py turns it into a C header.
[platformio]
default_envs = waveshare7

[env:waveshare7]
; pioarduino's build of the Espressif platform (PlatformIO's own "espressif32" has no
; board of this name), at the release this firmware is built and tested with: ESP-IDF
; 5.5.6. It needs PlatformIO core 6.2 or later, and says so under an older one.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.313/platform-espressif32.zip
board = esp32-s3-devkitc1-n16r8
framework = espidf
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
board_build.partitions = partitions.csv
extra_scripts =
    pre:settings_header.py
    post:ota_target.py
